<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit · Deploy PaidInbox</title>
    <!-- Local tool only: the dev server serves it, `vite build` does not include it. -->
    <style>
      :root { --bg: #05070D; --card: #0C121E; --line: #213049; --fg: #EAF0F8; --mu: #7D889C; --blue: #1D9BF0; --buy: #3DDC97; --sell: #FF6B7A }
      * { box-sizing: border-box }
      body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font: 15px/1.55 system-ui, 'Segoe UI', sans-serif; display: grid; place-items: center; padding: 24px 16px }
      main { width: min(560px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 26px; display: flex; flex-direction: column; gap: 16px }
      h1 { margin: 0; font-size: 22px }
      p { margin: 0; color: var(--mu) }
      label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--mu) }
      input { height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0 12px; font: 14px ui-monospace, Consolas, monospace }
      button { height: 46px; border-radius: 999px; border: 0; background: var(--blue); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer }
      button:disabled { opacity: .45; cursor: default }
      .row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px } .row b { font-family: ui-monospace, Consolas, monospace; font-weight: 500; word-break: break-all; text-align: right }
      #log { font: 13px/1.6 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 60px; color: var(--mu) }
      .ok { color: var(--buy) } .err { color: var(--sell) }
    </style>
  </head>
  <body>
    <main>
      <h1>Deploy PaidInbox</h1>
      <p>Despliega el contrato del correo de Orbit en Robinhood Chain firmando con tu wallet. Esta página nunca ve tu llave privada.</p>
      <button id="connect">Conectar wallet</button>
      <div class="row"><span>Wallet</span><b id="acct">—</b></div>
      <div class="row"><span>Red</span><b id="net">—</b></div>
      <label>Treasury: la wallet que cobra el 5 %. No se puede cambiar después.
        <input id="treasury" placeholder="0x…" spellcheck="false" autocomplete="off" />
      </label>
      <button id="deploy" disabled>Desplegar contrato</button>
      <div id="log">Conecta tu wallet dev para empezar.</div>
    </main>
    <script type="module" src="/src/tools/deployInbox.ts"></script>
  </body>
</html>
