<style>
/* Layout: a row of phone frames (390×844) on a dark stage; each frame is one app screen. App vibe: black, big numbers, glowing coin colors, thumb-reach actions at the bottom. */
:root {
  --bg: #000; --card: #0E0E10; --card2: #151518; --line: #1E1E22; --fg: #F6F6F7; --fg2: #C9C9CE; --mu: #8A8A93; --fa: #55555C;
  --buy: #3BE38F; --sell: #FF5D6C; --sun: #FFC53D; --sky: #7DD3FC; --pink: #F472B6;
  --font: 'Plus Jakarta Sans', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
body { margin: 0; background: #050506; color: var(--fg); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px }
.intro { max-width: 1400px; margin: 0 auto 22px; display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px }
.intro h1 { margin: 0; font-size: 30px; letter-spacing: -.03em }
.intro p { margin: 0; color: var(--mu); max-width: 70ch }
.stage { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; max-width: 1400px; margin: 0 auto }
.cap { display: flex; flex-direction: column; gap: 10px; align-items: center }
.cap b { font-size: 13px; color: var(--fg2); letter-spacing: .02em }
.phone { width: 390px; max-width: 100%; height: 844px; border-radius: 46px; background: var(--bg); border: 10px solid #1A1A1D; box-shadow: 0 0 0 1px #2A2A2E, 0 30px 80px rgba(0,0,0,.6); position: relative; overflow: hidden; display: flex; flex-direction: column }
.notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 112px; height: 30px; border-radius: 20px; background: #000; z-index: 20 }
.status { height: 48px; flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 26px 6px; font: 600 14px var(--font) }
.scroll { flex: 1; overflow: hidden; position: relative }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.mu { color: var(--mu) } .fa { color: var(--fa) } .up { color: var(--buy) } .dn { color: var(--sell) }
svg.gi { display: block; flex: none } svg.gi path { fill: currentColor }
img.logo, .logo { border-radius: 50%; object-fit: cover; flex: none; display: block; background: #1a1a1d }
.mono-logo { display: grid; place-items: center; font-weight: 800; color: rgba(255,255,255,.85) }

/* top bar */
.appbar { display: flex; align-items: center; gap: 10px; padding: 6px 16px 10px }
.appbar .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 19px; letter-spacing: -.02em }
.appbar .sp { flex: 1 }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--card2); font: 600 13px var(--mono) }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; background: var(--card2); display: grid; place-items: center; border: 0; color: var(--fg) }
.wallet-btn { height: 38px; padding: 0 14px 0 6px; border-radius: 999px; background: #fff; color: #000; display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13px; border: 0 }
.wallet-btn .dot { width: 26px; height: 26px; border-radius: 50%; background: #000; display: grid; place-items: center }

/* ticker */
.ticker { height: 34px; border-block: 1px solid var(--line); overflow: hidden; display: flex; align-items: center; background: linear-gradient(90deg, rgba(59,227,143,.06), transparent 40%, rgba(255,197,61,.06)) }
.ticker .run { display: flex; gap: 22px; white-space: nowrap; animation: run 38s linear infinite; padding-left: 16px }
.ticker span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg2) }
.ticker b { color: var(--buy); font-family: var(--mono) }
@keyframes run { to { transform: translateX(-50%) } }

/* stories */
.stories { display: flex; gap: 14px; padding: 14px 16px 6px; overflow: hidden }
.story { width: 66px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative }
.ring { width: 64px; height: 64px; border-radius: 50%; padding: 3px; background: linear-gradient(135deg, #3a3a3e, #19191b) }
.ring.new { background: conic-gradient(from 210deg, #F472B6, #FB923C, #FFC53D, #3BE38F, #60A5FA, #F472B6) }
.ring.up { background: linear-gradient(135deg, #3BE38F, #0f4d2d) }
.ring .logo { width: 100%; height: 100%; border: 3px solid #000 }
.story em { position: absolute; top: 54px; font: 800 8.5px var(--font); letter-spacing: .08em; background: #fff; color: #000; border-radius: 6px; padding: 1px 6px; border: 2px solid #000; font-style: normal }
.story b { font-size: 11px; margin-top: 6px; max-width: 66px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.story small { font: 600 10px var(--mono); margin-top: -3px }

/* stat chips */
.chips { display: flex; gap: 8px; padding: 10px 16px; overflow: hidden }
.stat { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 18px; background: var(--card); border: 1px solid var(--line) }
.stat b { font: 700 17px var(--mono); letter-spacing: -.03em; display: block; line-height: 1.1 }
.stat small { font-size: 10.5px; color: var(--mu); text-transform: uppercase; letter-spacing: .06em }
.tabs { display: flex; gap: 6px; padding: 4px 16px 10px; overflow: hidden }
.tab { flex: none; height: 34px; padding: 0 15px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--mu); font-weight: 700; font-size: 13px; display: inline-flex; align-items: center }
.tab.on { background: #fff; color: #000; border-color: #fff }

/* token cards */
.list { display: flex; flex-direction: column; gap: 10px; padding: 0 16px 120px }
.tcard { position: relative; border-radius: 24px; padding: 14px; background: var(--card); border: 1px solid var(--line); overflow: hidden; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center }
.tcard .glow { position: absolute; inset: -40% auto auto -20%; width: 70%; height: 180%; filter: blur(46px); opacity: .22; pointer-events: none }
.tcard .n { min-width: 0; position: relative } .tcard .n b { font-size: 15.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tcard .n small { color: var(--mu); font-size: 12px; display: flex; gap: 6px; align-items: center }
.tcard .r { text-align: right; position: relative }
.tcard .mc { font: 700 17px var(--mono); letter-spacing: -.03em }
.chg { display: inline-block; margin-top: 4px; font: 700 12px var(--mono); padding: 3px 8px; border-radius: 999px }
.chg.up { background: rgba(59,227,143,.14) } .chg.dn { background: rgba(255,93,108,.14) }
.tcard .bar { grid-column: 1 / -1; height: 5px; border-radius: 5px; background: #1d1d21; overflow: hidden; position: relative }
.tcard .bar i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, #6b6b73, var(--buy)) }
.tcard .meta { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 11.5px; color: var(--mu); margin-top: -6px; position: relative }

/* bottom nav */
.nav { position: absolute; left: 12px; right: 12px; bottom: 16px; height: 68px; border-radius: 26px; background: rgba(20,20,23,.92); backdrop-filter: blur(16px); border: 1px solid #26262b; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; z-index: 15 }
.nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; color: var(--fa) }
.nav a.on { color: #fff }
.nav a.center { width: 54px; height: 54px; border-radius: 18px; background: #fff; color: #000; justify-self: center; justify-content: center; margin-top: -26px; box-shadow: 0 10px 30px rgba(255,255,255,.18) }
.homebar { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 5px; background: #fff; opacity: .85; z-index: 16 }

/* token screen */
.hero { position: relative; padding: 4px 18px 14px; overflow: hidden }
.hero .bgblur { position: absolute; inset: -60px -40px auto; height: 260px; filter: blur(60px); opacity: .35 }
.hero .top { position: relative; display: flex; align-items: center; gap: 12px }
.hero h2 { margin: 0; font-size: 21px; letter-spacing: -.02em }
.hero .big { position: relative; font: 800 40px var(--mono); letter-spacing: -.05em; margin-top: 14px; line-height: 1 }
.hero .sub { position: relative; display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 12.5px }
.chart { padding: 0 6px } .chart svg { display: block; width: 100% }
.ranges { display: flex; gap: 6px; padding: 6px 16px 12px } .ranges span { flex: 1; text-align: center; height: 32px; line-height: 32px; border-radius: 12px; font: 700 12px var(--mono); color: var(--mu) } .ranges span.on { background: var(--card2); color: #fff }
.curvecard { margin: 0 16px; border-radius: 20px; padding: 14px; background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px }
.curvecard .row { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px }
.curvecard .trk { height: 12px; border-radius: 12px; background: #1d1d21; overflow: hidden } .curvecard .trk i { display: block; height: 100%; border-radius: 12px; background: linear-gradient(90deg, #3BE38F, #FFC53D) }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 16px }
.grid2 div { border-radius: 18px; background: var(--card); border: 1px solid var(--line); padding: 12px }
.grid2 small { color: var(--mu); font-size: 11px; display: block } .grid2 b { font: 700 16px var(--mono) }
.grid2 .gold { background: linear-gradient(135deg, rgba(255,197,61,.16), var(--card)); border-color: rgba(255,197,61,.25) } .grid2 .gold b { color: var(--sun) }
.cta { position: absolute; left: 12px; right: 12px; bottom: 16px; display: flex; gap: 10px; z-index: 15 }
.cta .star { width: 60px; height: 60px; border-radius: 22px; background: var(--card2); border: 1px solid #2a2a2e; display: grid; place-items: center; font-size: 22px; color: var(--sun) }
.cta .go { flex: 1; height: 60px; border-radius: 22px; background: var(--buy); color: #04140b; font-weight: 800; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 12px 34px rgba(59,227,143,.3) }
.trows { padding: 4px 16px 110px; display: flex; flex-direction: column }
.trow { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line) }
.trow b { font-size: 13.5px } .trow small { color: var(--mu); font-size: 11.5px; display: block }
.trow .amt { text-align: right; font: 700 13.5px var(--mono) }
.avt { border-radius: 50%; display: grid; place-items: center; flex: none }
.sec { padding: 14px 16px 6px; font: 700 12px var(--mono); color: var(--mu); text-transform: uppercase; letter-spacing: .08em; display: flex; align-items: center; gap: 8px }

/* live feed */
.feed { display: flex; flex-direction: column; gap: 10px; padding: 4px 16px 120px }
.buy { position: relative; border-radius: 22px; padding: 14px; background: var(--card); border: 1px solid var(--line); display: grid; grid-template-columns: 56px minmax(0,1fr) auto; gap: 12px; align-items: center; overflow: hidden }
.buy.whale { border-color: rgba(255,197,61,.45); background: radial-gradient(120% 140% at 0% 0%, rgba(255,197,61,.18), var(--card) 55%) }
.buy.dolphin { border-color: rgba(125,211,252,.35); background: radial-gradient(120% 140% at 0% 0%, rgba(125,211,252,.12), var(--card) 55%) }
.buy .coin { position: relative } .buy .coin .tier { position: absolute; right: -6px; bottom: -6px; width: 26px; height: 26px; border-radius: 50%; background: #000; display: grid; place-items: center }
.buy .n b { font-size: 16px } .buy .n small { display: flex; align-items: center; gap: 6px; color: var(--mu); font-size: 12px; margin-top: 2px }
.buy .usd { font: 800 20px var(--mono); letter-spacing: -.04em; text-align: right } .buy .usd small { display: block; font: 600 11px var(--font); color: var(--fa); letter-spacing: 0 }
.buy.whale .usd { color: var(--sun) } .buy.dolphin .usd { color: var(--sky) }
.livehd { display: flex; align-items: center; gap: 10px; padding: 8px 16px 4px }
.livehd h2 { margin: 0; font-size: 26px; letter-spacing: -.03em } .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--buy); box-shadow: 0 0 0 6px rgba(59,227,143,.15) }

/* leaderboard */
.podium { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 8px; padding: 18px 14px 8px; align-items: end }
.pod { border-radius: 22px; background: var(--card); border: 1px solid var(--line); padding: 26px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; position: relative; min-width: 0 }
.pod.first { padding-top: 34px; border-color: rgba(255,197,61,.4); background: linear-gradient(180deg, rgba(255,197,61,.14), var(--card) 70%) }
.pod .m { position: absolute; top: -16px; width: 32px; height: 32px; border-radius: 50%; background: #000; border: 1px solid #2a2a2e; display: grid; place-items: center }
.pod b { font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap } .pod .e { font: 800 16px var(--mono); color: var(--sun) } .pod.first .e { font-size: 19px }
.pod .coinmini { display: flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--mu) }
.lrow { display: grid; grid-template-columns: 22px 36px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line) }
.lrow .e { font: 700 14px var(--mono); color: var(--sun); text-align: right }

/* wallet sheet */
.dim { position: absolute; inset: 0; background: rgba(0,0,0,.6); z-index: 18 }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 19; border-radius: 30px 30px 0 0; background: #111113; border-top: 1px solid #2a2a2e; padding: 10px 18px 40px; display: flex; flex-direction: column; gap: 12px }
.sheet .grab { width: 42px; height: 5px; border-radius: 5px; background: #3a3a3e; align-self: center; margin-bottom: 6px }
.sheet h3 { margin: 0; font-size: 21px; letter-spacing: -.02em } .sheet p { margin: 0; color: var(--mu); font-size: 13px }
.wopt { display: flex; align-items: center; gap: 12px; height: 62px; padding: 0 14px; border-radius: 18px; background: var(--card2); border: 1px solid #26262b; font-weight: 700 }
.wopt .wi { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 20px } .wopt span.sp { flex: 1 } .wopt small { color: var(--mu); font-weight: 600 }
.pf-hero { padding: 6px 18px 12px } .pf-hero .bal { font: 800 38px var(--mono); letter-spacing: -.05em }

/* mail */
.inbox { display: flex; flex-direction: column; padding: 0 0 120px }
.mrow { display: grid; grid-template-columns: 48px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line) }
.mrow b { font-size: 14.5px } .mrow p { margin: 2px 0 0; color: var(--mu); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.mrow .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 11px; color: var(--fa) }
.paid { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: rgba(255,197,61,.14); color: var(--sun); font: 700 11px var(--mono) }
.compose { position: absolute; right: 18px; bottom: 100px; z-index: 15; height: 54px; padding: 0 20px; border-radius: 20px; background: #fff; color: #000; display: flex; align-items: center; gap: 8px; font-weight: 800; box-shadow: 0 12px 30px rgba(255,255,255,.15) }
@media (max-width: 440px) { .phone { width: 100%; border-width: 6px; border-radius: 34px } }
@media (prefers-reduced-motion: reduce) { .ticker .run { animation: none } }
</style>

      <div class="big">${usd(t.mcap)}</div><div class="sub"><span class="chg ${t.chg >= 0 ? 'up' : 'dn'}">${pct(t.chg)}</span><span class="mu">market cap · 1h</span></div></div>
    <div class="chart"><svg viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3BE38F" stop-opacity=".35"/><stop offset="1" stop-color="#3BE38F" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w - 4} ${h} L4 ${h}Z" fill="url(#g)"/><path d="${d}" fill="none" stroke="#3BE38F" stroke-width="2.4"/><circle cx="${P[P.length - 1][0]}" cy="${P[P.length - 1][1]}" r="5" fill="#3BE38F" stroke="#000" stroke-width="2"/></svg></div>
    <div class="ranges"><span>5m</span><span>1h</span><span class="on">24h</span><span>All</span><span>MC</span></div>
    <div class="curvecard"><div class="row"><b>${icon('launch', 18, '#60A5FA')}</b><span style="flex:1;margin-left:8px;font-weight:700">Bonding curve</span><b class="mono">${(t.progress * 100).toFixed(1)}%</b></div><div class="trk"><i style="width:${Math.max(3, t.progress * 100)}%"></i></div><div class="row mu"><span>${t.raised.toFixed(2)} / ${t.goal.toFixed(2)} ETH</span><span>${Math.max(0, t.goal - t.raised).toFixed(2)} ETH to graduate 🎓</span></div></div>
    <div class="grid2"><div><small>Volume</small><b>${usd(vol)}</b></div><div><small>Buys / sells</small><b><span class="up">${tr.filter((x) => x.side === 'buy').length}</span> / <span class="dn">${tr.filter((x) => x.side === 'sell').length}</span></b></div><div><small>Holders</small><b>${new Set(tr.map((x) => x.trader)).size}</b></div><div class="gold"><small>Creator earned</small><b>${usd(earned)}</b></div></div>
    <div class="sec">${icon('trades', 15)}Trades</div>
    <div class="trows">${last.map((x) => `<div class="trow">${av(x.trader, 34)}<div><b>${nameOf(x.trader)}</b><small>${x.side === 'buy' ? '<span class="up">Bought</span>' : '<span class="dn">Sold</span>'} · ${ago(x.block)}</small></div><div class="amt ${x.side === 'buy' ? 'up' : 'dn'}">${x.side === 'buy' ? '+' : '−'}${usd(x.q * eth)}</div></div>`).join('')}</div>
  </div><div class="cta"><span class="star">★</span><span class="go">${icon('trades', 20, '#04140b')}Trade on pons</span></div><div class="homebar"></div>`;

/* 3 · Live buys */
function sLive() {
  return `${status}${appbar()}<div class="scroll"><div class="livehd"><span class="pulse"></span><h2>Live buys</h2></div>
    <div class="tabs"><span class="tab on">All</span><span class="tab">🐋 Whales</span><span class="tab">🐬 Dolphins</span><span class="tab">Following</span></div>
    <div class="feed">${D.bigBuys.slice(0, 7).map((b) => { const tk = tokOf(b.token), tier = b.usd >= 1000 ? 'whale' : 'dolphin'; return `<div class="buy ${tier}"><span class="coin">${logo(b.token, 56, tk.symbol)}<span class="tier">${icon(tier, 18, tier === 'whale' ? '#FFC53D' : '#7DD3FC')}</span></span><div class="n"><b>$${tk.symbol}</b><small>${av(b.trader, 18)}${nameOf(b.trader)}</small></div><div class="usd">+${usd(b.usd)}<small>${ago(b.block)} ago</small></div></div>` }).join('')}</div>
  </div>${nav('live')}`;
}

/* 4 · Leaderboard */
function sRanks() {
  const by = {}; for (const r of D.earnings) { const x = (by[r.deployer] ??= { a: r.deployer, usd: 0, coins: [] }); x.usd += r.earnUsd; x.coins.push(r) }
  const R = Object.values(by).filter((x) => x.usd > 0).sort((a, b) => b.usd - a.usd).map((x) => ({ ...x, coins: x.coins.sort((a, b) => b.earnUsd - a.earnUsd) }));
  const mc = ['#FFC53D', '#D4D4D8', '#D08A52'];
  const pod = (x, i) => `<div class="pod ${i === 0 ? 'first' : ''}"><span class="m">${icon('medal', 20, mc[i])}</span>${av(x.a, i === 0 ? 58 : 46)}<b>${nameOf(x.a)}</b><span class="e">${usd(x.usd)}</span><span class="coinmini">${logo(x.coins[0].token, 16, x.coins[0].symbol)}$${x.coins[0].symbol}</span></div>`;
  return `${status}${appbar()}<div class="scroll"><div class="livehd"><h2>Creator rewards</h2></div><div class="tabs"><span class="tab on">💰 Creators</span><span class="tab">Traders</span><span class="tab">Hunters</span></div>
    <div class="podium">${[1, 0, 2].map((i) => pod(R[i], i)).join('')}</div>
    ${R.slice(3, 9).map((x, i) => `<div class="lrow"><span class="mono fa">${i + 4}</span>${av(x.a, 36)}<div style="min-width:0"><b style="font-size:13.5px">${nameOf(x.a)}</b><small class="mu" style="display:flex;gap:5px;align-items:center;font-size:11.5px">${logo(x.coins[0].token, 14, x.coins[0].symbol)}$${x.coins[0].symbol}</small></div><span class="e">${usd(x.usd)}</span></div>`).join('')}
  </div>${nav('ranks')}`;
}

/* 5 · Me: portfolio with the connect-wallet sheet open */
function sMe() {
  const P = D.portfolio;
  return `${status}${appbar()}<div class="scroll"><div class="pf-hero"><span class="mu" style="font-size:12.5px">Portfolio value</span><div class="bal">$0.00</div><span class="mu" style="font-size:12.5px">Connect to see your bags, P&L and alerts</span></div>
    <div class="grid2"><div><small>Following</small><b>0</b></div><div><small>Alerts</small><b>0</b></div></div></div>
    <div class="dim"></div><div class="sheet"><span class="grab"></span><h3>Connect wallet</h3><p>Your wallet is your account. No email, no password. Orbit never asks for your secret phrase.</p>
      <div class="wopt"><span class="wi" style="background:#F6851B22">🦊</span>MetaMask<span class="sp"></span><small>Detected</small></div>
      <div class="wopt"><span class="wi" style="background:#3B99FC22">🔗</span>WalletConnect<span class="sp"></span><small>Mobile wallets</small></div>
      <div class="wopt"><span class="wi" style="background:#0052FF22">🔵</span>Coinbase Wallet<span class="sp"></span><small></small></div>
      <p style="text-align:center;font-size:11.5px">Robinhood Chain is added automatically</p></div>`;
}

/* 6 · Mail */
function sMail() {
  const people = D.leaders.filter((l) => !l.bot).slice(0, 2).map((l) => l.a).concat(D.creatorsTop.slice(0, 4).map((c) => c.a));
  const msgs = ['gm! saw your launch, want to collab?', 'replied · payment settled', 'Free · you are contacts', 'Can we talk about a listing?', 'Thanks for the support 🙏', 'Next launch is this Friday'];
  return `${status}${appbar(people[0])}<div class="scroll"><div class="livehd"><h2>Mail</h2><span style="flex:1"></span><span class="paid"><img src="${PONS}" width="14" height="14" style="border-radius:50%">250 PONS / msg</span></div>
    <div class="tabs"><span class="tab on">Inbox</span><span class="tab">Paid 2</span><span class="tab">Sent</span></div>
    <div class="inbox">${people.map((a, i) => `<div class="mrow">${av(a, 46)}<div style="min-width:0"><b>${nameOf(a)}</b><p>${msgs[i]}</p></div><div class="side">${['2m', '18m', '1h', '3h', '5h', '1d'][i]}${i < 2 ? `<span class="paid">${i === 0 ? '500 PONS' : '0.01 ETH'}</span>` : ''}</div></div>`).join('')}</div>
  </div><span class="compose">✎ New message</span>${nav('me')}`;
}

const screens = [['Radar', sRadar], ['Token', sToken], ['Live buys', sLive], ['Leaderboard', sRanks], ['Connect wallet', sMe], ['Mail', sMail]];
document.getElementById('stage').innerHTML = screens.map(([cap, f]) => `<div class="cap"><div class="phone">${f()}</div><b>${cap}</b></div>`).join('');
</script>
