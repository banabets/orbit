<meta charset="utf-8">
<title>Orbit 3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: collapsible icon rail + topbar + routed views. Pure black and neutral grays; color only carries meaning: green buy, red sell, gold money and whales. Icons: Phosphor duotone for UI, Fluent 3D emoji for events and avatars. */
:root {
  --bg: #000000; --bg2: #090909; --s1: #0F0F0F; --s2: #151515; --s3: #1D1D1D; --line: #1A1A1A; --line2: #2A2A2A;
  --fg: #F4F4F4; --fg2: #C9C9C9; --mu: #8B8B8B; --fa: #5E5E5E;
  --acc: #F4F4F4; --acc-s: rgba(255,255,255,.07);
  --buy: #34D399; --buy-s: rgba(52,211,153,.12); --sell: #F87171; --sell-s: rgba(248,113,113,.12); --sun: #FBBF24; --sun-s: rgba(251,191,36,.12);
  --font: 'Plus Jakarta Sans', 'Noto Sans SC', system-ui, -apple-system, Segoe UI, sans-serif; --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line2) transparent }
::-webkit-scrollbar { width: 8px; height: 8px } ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 8px }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden }
button { font: inherit; color: inherit; cursor: pointer }
a { color: inherit; text-decoration: none }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 6px }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.mu { color: var(--mu) } .fa { color: var(--fa) } .up { color: var(--buy) } .dn { color: var(--sell) }
svg.ph { width: 17px; height: 17px; flex: none; fill: currentColor }
svg.ph.sm { width: 13px; height: 13px }
.emo { display: block; flex: none; object-fit: contain }
.eth { flex: none; display: inline-block; vertical-align: -3px }

/* shell */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100%; transition: grid-template-columns .2s ease }
.app.folded { grid-template-columns: 68px minmax(0, 1fr) }
.rail { border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; padding: 14px 10px; min-height: 0; overflow: auto; background: var(--bg) }
.brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 18px }
.brand b { font-size: 17px; letter-spacing: -.02em }
.fold { margin-left: auto; width: 30px; height: 30px; border-radius: 9px; border: 0; background: transparent; color: var(--fa); display: grid; place-items: center }
.fold:hover { background: var(--s2); color: var(--fg) }
.nav { display: flex; align-items: center; gap: 11px; height: 40px; padding: 0 11px; border-radius: 11px; border: 0; background: transparent; color: var(--mu); font-weight: 600; width: 100%; text-align: left; position: relative }
.nav:hover { background: var(--s1); color: var(--fg) }
.nav[aria-current='page'] { background: var(--s2); color: var(--fg) }
.nav[aria-current='page']::before { content: ''; position: absolute; left: -10px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--fg) }
.nav svg.ph { width: 20px; height: 20px }
.nav .cnt { margin-left: auto; font: 600 10px var(--mono); background: var(--sell); color: #fff; border-radius: 999px; padding: 0 6px; line-height: 17px }
.grp { font: 600 10px var(--mono); color: var(--fa); text-transform: uppercase; letter-spacing: .12em; padding: 18px 11px 6px }
.watch { display: flex; align-items: center; gap: 9px; padding: 6px 11px; border-radius: 9px; font-size: 12.5px; border: 0; background: transparent; width: 100% }
.watch:hover { background: var(--s1) }
.watch .mono { margin-left: auto; font-size: 11.5px }
.app.folded .rail { align-items: center; padding-inline: 8px }
.app.folded .brand { flex-direction: column; padding: 2px 0 14px; gap: 12px }
.app.folded .brand b, .app.folded .nav .lbl, .app.folded .grp, .app.folded .watch .lbl, .app.folded .watch .mono { display: none }
.app.folded .fold { margin: 0 }
.app.folded .nav { width: 48px; justify-content: center; padding: 0 }
.app.folded .nav .cnt { position: absolute; top: 6px; right: 7px; width: 8px; height: 8px; padding: 0; font-size: 0 }
.app.folded .nav[aria-current='page']::before { left: -8px }
.app.folded .watch { width: 48px; justify-content: center; padding: 6px 0 }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0 }
.top { height: 60px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 20px; border-bottom: 1px solid var(--line) }
.search { display: flex; align-items: center; gap: 9px; height: 38px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line2); background: var(--s1); color: var(--fa); width: min(400px, 38%) }
.search input { border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; flex: 1; min-width: 0 }
.kbd { font: 10px var(--mono); border: 1px solid var(--line2); border-radius: 5px; padding: 0 5px }
.ticks { display: flex; gap: 22px; margin-left: auto; min-width: 0; align-items: center }
.tick { display: flex; align-items: center; gap: 8px; line-height: 1.2 }
.tick span { font-size: 10.5px; color: var(--mu); display: block } .tick b { font: 600 13px var(--mono) }
.live { display: inline-flex; align-items: center; gap: 6px; font: 600 11px var(--mono); color: var(--buy); text-transform: uppercase; letter-spacing: .08em }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--buy); display: inline-block; box-shadow: 0 0 0 0 rgba(52,211,153,.6); animation: ping 1.8s infinite }
@keyframes ping { 70% { box-shadow: 0 0 0 7px rgba(52,211,153,0) } 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0) } }
.lang { position: relative }
.lang > button { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 11px; border-radius: 11px; border: 1px solid var(--line2); background: var(--s1); font-weight: 600; font-size: 12.5px }
.menu { position: absolute; right: 0; top: 42px; z-index: 30; width: 236px; border: 1px solid var(--line2); border-radius: 13px; background: var(--s2); padding: 6px; box-shadow: 0 18px 50px rgba(0,0,0,.7) }
.menu button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; border: 0; background: transparent; text-align: left }
.menu button:hover { background: var(--s3) }
.menu button[aria-checked='true'] { font-weight: 700 }
.menu .code { font: 600 11px var(--mono); width: 26px; color: var(--mu) }
.menu .sep { height: 1px; background: var(--line2); margin: 6px 4px }
.menu small { display: block; padding: 4px 10px 6px; color: var(--mu); font-size: 11px; line-height: 1.45 }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--line2); background: var(--s2); font-weight: 600; font-size: 12.5px; white-space: nowrap }
.btn:hover { border-color: #444 }
.btn.pri { background: var(--fg); color: #000; border-color: var(--fg) }
.btn.sm { height: 30px; padding: 0 10px; font-size: 12px; border-radius: 9px }
.btn[disabled] { opacity: .35; cursor: default }
.view { flex: 1; min-height: 0; overflow: auto }
.page { padding: 22px 26px 44px; display: flex; flex-direction: column; gap: 18px; max-width: 1580px }
.toast { position: fixed; right: 20px; bottom: 20px; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 13px; background: var(--s2); border: 1px solid var(--line2); box-shadow: 0 18px 50px rgba(0,0,0,.7); font-size: 12.5px; max-width: 380px }
.toast .x { border: 0; background: transparent; color: var(--mu); margin-left: 6px }

/* shared pieces */
.h1 { font-size: 28px; letter-spacing: -.035em; margin: 0; text-wrap: balance }
.sub { color: var(--mu); margin: 3px 0 0; font-size: 13px; max-width: 70ch }
.row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap }
.sp { flex: 1 }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--s1); border: 1px solid var(--line) }
.seg button { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; height: 30px; padding: 0 12px; border-radius: 9px; font-size: 12.5px; color: var(--mu); font-weight: 600 }
.seg button[aria-pressed='true'] { background: var(--s3); color: var(--fg) }
.seg button .emo { width: 16px; height: 16px }
.card { border: 1px solid var(--line); border-radius: 18px; background: var(--bg2) }
.sec-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line) }
.sec-h h3 { margin: 0; font-size: 14.5px; letter-spacing: -.01em }
.sec-h .emo { width: 26px; height: 26px }
.img { border-radius: 50%; object-fit: cover; flex: none; background: var(--s3); display: block }
.avt { border-radius: 50%; flex: none; display: inline-grid; place-items: center; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08) }
.avt img { display: block }
img.avt { object-fit: cover }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 21px; padding: 0 8px; border-radius: 7px; font-size: 10.5px; font-weight: 700; background: var(--s3); color: var(--fg2); white-space: nowrap }
.tag svg.ph { width: 12px; height: 12px } .tag .emo { width: 14px; height: 14px }
.tag.sun { background: var(--sun-s); color: var(--sun) } .tag.buy { background: var(--buy-s); color: var(--buy) } .tag.sell { background: var(--sell-s); color: var(--sell) }
.side-ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--s3); color: var(--fg2) }
.side-ic.buy { background: var(--buy-s); color: var(--buy) } .side-ic.sell { background: var(--sell-s); color: var(--sell) }
.side-ic .emo { width: 20px; height: 20px }
.prog { display: grid; grid-template-columns: 1fr 38px; gap: 8px; align-items: center }
.prog .trk { height: 6px; border-radius: 6px; background: var(--s3); overflow: hidden }
.prog .trk i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #8B8B8B, var(--buy)) }
.prog em { font: 11px var(--mono); color: var(--mu); text-align: right; font-style: normal }
.spark { display: block }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px }
.kpi { border: 1px solid var(--line); border-radius: 16px; background: var(--bg2); padding: 14px; display: flex; gap: 12px; align-items: center; min-width: 0 }
.kpi .emo, .kpi .eth { width: 38px; height: 38px }
.kpi span { font-size: 11.5px; color: var(--mu); display: block; white-space: nowrap } .kpi b { font: 600 19px var(--mono); letter-spacing: -.02em; display: flex; align-items: center; gap: 6px; white-space: nowrap } .kpi b .emo { width: 18px; height: 18px }
.kpi b small { font: 500 12px var(--mono); color: var(--mu) }

/* tables */
.tbl { overflow-x: auto }
.tr { display: grid; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); min-width: 760px }
.tr:last-child { border-bottom: 0 }
.tr.th { font: 600 10.5px var(--mono); color: var(--fa); text-transform: uppercase; letter-spacing: .06em; padding-block: 9px; background: var(--bg) }
.tr .r { text-align: right; justify-content: flex-end }
a.tr:hover, .tr.hov:hover { background: var(--s1) }
.tok { display: flex; align-items: center; gap: 11px; min-width: 0 }
.tok .n { min-width: 0 } .tok .n b { display: block; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tok .n small { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--mu) }
.acct { display: inline-flex; align-items: center; gap: 8px; min-width: 0; font-weight: 600 }
.acct .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
a.acct:hover .nm { text-decoration: underline; text-underline-offset: 3px }
.amt { display: inline-flex; align-items: center; gap: 5px }

/* radar */
.radar { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start }
.big { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; padding: 16px }
.bigc { border: 1px solid var(--line); border-radius: 15px; padding: 13px; background: var(--s1); display: flex; flex-direction: column; gap: 10px; transition: transform .15s, border-color .15s }
.bigc:hover { transform: translateY(-2px); border-color: var(--line2) }
.bigc .mc { font: 600 21px var(--mono); letter-spacing: -.02em }
.bigc .meta { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--mu) }
.feed .it { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 11px; align-items: center; padding: 11px 16px; border-bottom: 1px solid var(--line) }
.feed .it:last-child { border-bottom: 0 }
.feed .it p { margin: 0; font-size: 12.5px; color: var(--fg2); display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: center; min-width: 0 } .feed .it p b { color: var(--fg) }
.feed time { font: 11px var(--mono); color: var(--fa) }
.feed .badge { position: relative; width: 36px; height: 36px }
.feed .badge .emo { position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)) }
.rcol { display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0 }
.tier { display: inline-flex; align-items: center; gap: 4px; font: 700 10.5px var(--font); padding: 0 7px; height: 21px; border-radius: 7px }
.tier.whale { background: var(--sun-s); color: var(--sun) } .tier.dolphin { background: rgba(125,211,252,.12); color: #7DD3FC }
.tier .emo { width: 15px; height: 15px }

/* token */
.tokhead { display: flex; align-items: center; gap: 16px; flex-wrap: wrap }
.tokhead h2 { margin: 0; font-size: 25px; letter-spacing: -.03em }
.price { font: 600 29px var(--mono); letter-spacing: -.03em }
.chart { padding: 6px 8px 0 }
.chart svg { display: block; width: 100% }
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 16px; overflow: hidden }
.stats > div { padding: 13px 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; min-width: 0 }
.stats > div:last-child { border-right: 0 }
.stats > div > span { font-size: 11px; color: var(--mu); display: flex; gap: 6px; align-items: center } .stats b { font: 600 15.5px var(--mono); white-space: nowrap }
.stats .earn { background: linear-gradient(135deg, var(--sun-s), transparent) } .stats .earn b { color: var(--sun) }
.stats .earn .emo { width: 16px; height: 16px }
.creator { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 1px solid var(--line2); border-radius: 16px; background: linear-gradient(90deg, #121212, var(--bg2) 70%) }
.curvebar { display: flex; align-items: center; gap: 12px; padding: 12px 16px }
.curvebar .trk { flex: 1; height: 10px; border-radius: 10px; background: var(--s3); overflow: hidden }
.curvebar .trk i { display: block; height: 100%; background: linear-gradient(90deg, #8B8B8B, var(--buy)) }
.tabs { display: flex; align-items: center; gap: 4px; padding: 0 10px 0 6px; border-bottom: 1px solid var(--line) }
.tabs > button { display: inline-flex; align-items: center; gap: 7px; height: 48px; padding: 0 12px; border: 0; background: transparent; color: var(--mu); font-weight: 600; border-bottom: 2px solid transparent }
.tabs > button[aria-selected='true'] { color: var(--fg); border-bottom-color: var(--fg) }
.pager { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--mu); flex-wrap: wrap }
.pager select { height: 30px; border-radius: 9px; border: 1px solid var(--line2); background: var(--s1); color: var(--fg); font: inherit; padding: 0 6px }

/* launches & curves */
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start }
.lane-h { display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-bottom: 1px solid var(--line) }
.lane-h .emo { width: 26px; height: 26px }
.lane-h b { font-size: 13.5px } .lane-h .mono { margin-left: auto; color: var(--mu); font-size: 12px }
.lc { display: flex; flex-direction: column; gap: 9px; padding: 12px 14px; border-bottom: 1px solid var(--line) }
.lc:last-child { border-bottom: 0 }

/* leaderboard */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end }
.pod { border: 1px solid var(--line); border-radius: 18px; background: var(--bg2); padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; position: relative }
.pod.first { padding-block: 26px; border-color: rgba(251,191,36,.35); background: linear-gradient(180deg, var(--sun-s), var(--bg2) 65%) }
.pod .medal { width: 40px; height: 40px; position: absolute; top: -14px }

/* alerts & mail */
.rule { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line) }
.rule:last-child { border-bottom: 0 }
.rule > .emo { width: 30px; height: 30px }
.rule > div { flex: 1; min-width: 0 } .rule b { display: block; font-size: 13px } .rule small { color: var(--mu); font-size: 11.5px }
.sw { appearance: none; width: 36px; height: 21px; border-radius: 21px; background: var(--s3); position: relative; cursor: pointer; margin: 0; flex: none; transition: background .15s }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 15px; height: 15px; border-radius: 50%; background: var(--mu); transition: transform .15s, background .15s }
.sw:checked { background: var(--buy) } .sw:checked::after { transform: translateX(15px); background: #fff }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start }
.empty { padding: 30px; text-align: center; color: var(--mu); display: flex; flex-direction: column; align-items: center; gap: 12px }
.empty .emo { width: 54px; height: 54px }
.foot { color: var(--fa); font-size: 11.5px; line-height: 1.5 }


/* v5: stories, icon tiles, creator leaderboard, monogram logos */
svg.ic { display: block; flex: none }
.mono-logo { display: grid !important; place-items: center; color: rgba(255,255,255,.82); font-weight: 800; letter-spacing: -.02em; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08) }
.stories { display: flex; gap: 16px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none }
.stories::-webkit-scrollbar { display: none }
.story { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 76px; flex: none; position: relative }
.story .ring { padding: 3px; border-radius: 50%; display: block; transition: transform .15s }
.story:hover .ring { transform: scale(1.05) }
.story .ring.new { background: conic-gradient(from 210deg, #F472B6, #FB923C, #FBBF24, #34D399, #60A5FA, #F472B6) }
.story .ring.up { background: linear-gradient(135deg, #34D399, #14532D) } .story .ring.dn { background: linear-gradient(135deg, #3A3A3A, #1A1A1A) }
.story .ring .img { border: 3px solid #000 }
.story em { position: absolute; top: 58px; font: 800 9px var(--font); letter-spacing: .08em; background: #fff; color: #000; border-radius: 6px; padding: 1px 6px; border: 2px solid #000 }
.story b { font-size: 11.5px; margin-top: 6px; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.story small { font-size: 10.5px; margin-top: -4px }
.pod .medal { position: absolute; top: -18px; width: 40px; height: 40px; display: grid; place-items: center; background: #000; border-radius: 50%; border: 1px solid var(--line2) }
.pod .pn { font-size: 15px; margin-top: 4px }
.pod .earned { display: flex; align-items: center; gap: 8px; margin-top: 6px } .pod .earned b { font-size: 24px; color: var(--sun); letter-spacing: -.03em }
.pod.first .earned b { font-size: 30px }
.coinchip { display: flex; align-items: center; gap: 9px; padding: 7px 12px 7px 7px; border: 1px solid var(--line2); border-radius: 999px; background: var(--s1); margin-top: 6px; max-width: 100%; text-align: left }
.coinchip span { display: flex; flex-direction: column; min-width: 0 } .coinchip b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis } .coinchip small { color: var(--mu); font-size: 11px }
.podium { margin-top: 16px }
.bar-cell { display: flex; align-items: center; gap: 10px } .bar-cell .bar { flex: 1; height: 8px; border-radius: 8px; background: var(--s3); overflow: hidden } .bar-cell .bar i { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, #8B6A1A, var(--sun)) }
.bar-cell b { font-size: 12.5px; color: var(--sun); min-width: 64px; text-align: right }
.sets { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
.set { padding: 16px; display: flex; flex-direction: column; gap: 14px }
.set.on { border-color: #4A4A4A; box-shadow: 0 0 0 1px #4A4A4A }
.set-h { display: flex; align-items: center; gap: 10px } .set-h b { font-size: 15px; display: block } .set-h small { color: var(--mu); font-size: 11.5px }
.set .grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px }
.set .cell { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0 }
.set .tile { width: 54px; height: 54px; border-radius: 15px; background: var(--s1); border: 1px solid var(--line); display: grid; place-items: center }
.set .cell small { font-size: 10px; color: var(--mu); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100% }

const mix = (x) => { x = Math.imul(x ^ (x >>> 16), 0x7feb352d); x = Math.imul(x ^ (x >>> 15), 0x846ca68b); return (x ^ (x >>> 16)) >>> 0 };
const fnv = (s) => { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) } return h >>> 0 };

function bigChart(trades) {
  const W0 = Math.max(560, Math.round((document.getElementById('view').clientWidth || 1100) - 70)), H0 = 340, VH = 58, pad = 8;
  const pts = trades.filter((x) => x.tok > 0).map((x) => ({ p: (x.q / x.tok) * D.eth, q: x.q * D.eth, buy: x.side === 'buy' }));
  if (pts.length < 2) return '';
  const lo = Math.min(...pts.map((x) => x.p)), hi = Math.max(...pts.map((x) => x.p)), mq = Math.max(...pts.map((x) => x.q));
  const X = (i) => pad + (i / (pts.length - 1)) * (W0 - pad * 2 - 74), Y = (p) => pad + 26 + (1 - (p - lo) / ((hi - lo) || 1)) * (H0 - VH - 56);
  const d = pts.map((x, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(x.p).toFixed(1)).join(' ');
  const last = pts[pts.length - 1], up = last.p >= pts[0].p, c = up ? '#34D399' : '#F87171';
  const grid = [0, 0.25, 0.5, 0.75, 1].map((f) => { const y = pad + 26 + f * (H0 - VH - 56), v = hi - f * (hi - lo); return `<line x1="${pad}" x2="${W0 - 74}" y1="${y}" y2="${y}" stroke="#1A1A1A"/><text x="${W0 - 68}" y="${y + 4}" fill="#5E5E5E" font-size="11" font-family="JetBrains Mono">${px(v)}</text>` }).join('');
  const bw = Math.max(1.5, (W0 - 90) / pts.length - 1.2);
  const vols = pts.map((x, i) => `<rect x="${X(i) - bw / 2}" y="${H0 - 18 - (x.q / mq) * VH}" width="${bw}" height="${(x.q / mq) * VH}" rx="1" fill="${x.buy ? 'rgba(52,211,153,.5)' : 'rgba(248,113,113,.5)'}"/>`).join('');
  const marks = pts.map((x, i) => { const k = x.buy ? tier(x.q) : null; return k ? `<image href="${FL.img[k === 'whale' ? 'Spouting whale' : 'Dolphin']}" x="${X(i) - 11}" y="${Y(x.p) - 28}" width="22" height="22"/>` : '' }).join('');
  return `<svg viewBox="0 0 ${W0} ${H0}" role="img" aria-label="Price chart">
    <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".25"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${d} L${X(pts.length - 1)} ${H0 - VH - 30} L${X(0)} ${H0 - VH - 30}Z" fill="url(#ga)"/><path d="${d}" fill="none" stroke="${c}" stroke-width="2"/>${vols}${marks}
    <line x1="${pad}" x2="${W0 - 74}" y1="${Y(last.p)}" y2="${Y(last.p)}" stroke="${c}" stroke-dasharray="3 4" opacity=".6"/>
    <rect x="${W0 - 72}" y="${Y(last.p) - 10}" width="68" height="20" rx="6" fill="${c}"/><text x="${W0 - 38}" y="${Y(last.p) + 4}" text-anchor="middle" fill="#000" font-size="11" font-weight="700" font-family="JetBrains Mono">${px(last.p)}</text>
  </svg>`;
}

  const gradBig = BIGS.filter((b) => b.stage === 'graduated').slice(0, 6);
  const lane = (title, em, items, render) => `<section class="card"><div class="lane-h">${E(em, 26)}<b>${title}</b><span class="mono">${items.length}</span></div>${items.length ? items.map(render).join('') : `<div class="empty">${E(em, 54)}<span>${t('noneNow')}</span></div>`}</section>`;
  const curveCard = (x) => `<a class="lc" href="#token"><div class="tok">${logo(x.token, 34)}<div class="n"><b>${x.name}</b><small>$${x.symbol} · ${ago(x.ageMin)}</small></div><span class="sp"></span><span class="mono ${x.chg >= 0 ? 'up' : 'dn'}" style="font-size:12px">${pct(x.chg)}</span></div><div class="prog"><div class="trk"><i style="width:${Math.max(2, x.progress * 100)}%"></i></div><em>${nf(x.progress * 100, 0)}%</em></div><div class="row mu" style="font-size:11.5px;gap:10px"><span>${usd(x.mcap)}</span><span class="amt up">${I('arrow-up-right', 'sm')}${x.buys}</span><span class="amt dn">${I('arrow-down-right', 'sm')}${x.sells}</span><span class="sp"></span><span class="amt">${t('toGo')} ${nf(Math.max(0, x.goal - x.raised), 2)} ${ETH(12)}</span></div></a>`;
  return `<div class="page">
    <div><h1 class="h1">${t('lcTitle')}</h1><p class="sub">${t('radarSub')}</p></div>
    <div class="board">
      ${lane(t('justLaunched'), 'Rocket', fresh, curveCard)}
      ${lane(t('climbing'), 'Chart increasing', climb, curveCard)}
      ${lane(t('nearGrad'), 'Fire', near, curveCard)}
      ${lane(t('gradDone'), 'Graduation cap', gradBig, (b) => `<a class="lc" href="#token"><div class="tok">${logo(b.addr, 34, b.symbol)}<div class="n"><b>${b.name}</b><small>$${b.symbol}</small></div><span class="sp"></span>${E('Graduation cap', 18)}</div><div class="row" style="font-size:12px"><b class="mono">${usd(b.mcap)}</b><span class="sp"></span><span class="mu amt">${pairIc(b.pair)}${b.pair}</span></div></a>`)}
    </div></div>`;
}


function creatorsRank() {
  const by = {};
  for (const r of D.earnings) { const d = (by[r.deployer] ??= { a: r.deployer, usd: 0, coins: [] }); d.usd += r.earnUsd; d.coins.push(r) }
  return Object.values(by).filter((d) => d.usd > 0).map((d) => ({ ...d, coins: d.coins.sort((a, b) => b.earnUsd - a.earnUsd) })).sort((a, b) => b.usd - a.usd);
}
function vLeader() {
  if (lbTab === 'traders') return vTraders();
  const R = creatorsRank(), total = R.reduce((s, d) => s + d.usd, 0), maxU = R[0]?.usd || 1;
  const coinCard = (c) => `<a class="coinchip" href="#token">${logo(c.token, 30, c.symbol)}<span><b>${c.name}</b><small>$${c.symbol} · ${usd(c.mcap)}</small></span></a>`;
  const medalC = ['#FBBF24', '#D4D4D4', '#D08A52'];
  const pod = (d, i) => `<div class="pod ${i === 0 ? 'first' : ''}"><span class="medal">${IC('medal', 40, { color: medalC[i] })}</span>
      ${av(d.a, i === 0 ? 76 : 60)}<b class="pn">${nameOf(d.a)}</b><span class="mono mu" style="font-size:11.5px">${short(d.a)}</span>
      <div class="earned">${IC('rewards', 20)}<b class="mono">${usd(d.usd)}</b></div><span class="mu" style="font-size:11.5px">${t('earnedFrom')}</span>
      ${coinCard(d.coins[0])}${d.coins.length > 1 ? `<span class="mu" style="font-size:11.5px">+${d.coins.length - 1} ${t('moreCoins')}</span>` : ''}</div>`;
  const COLS = 'grid-template-columns:48px minmax(200px,1.3fr) minmax(200px,1.3fr) minmax(160px,1fr) 110px 70px 90px';
  return `<div class="page">
    <div class="row"><div><h1 class="h1">${t('lbTitle')}</h1><p class="sub">${t('lbCreatorSub')}</p></div><span class="sp"></span><div class="seg">${[['creators', 'crRewards'], ['traders', 'traders']].map(([k, l]) => `<button data-lb="${k}" aria-pressed="${lbTab === k}">${t(l)}</button>`).join('')}</div></div>
    <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="kpi">${IC('rewards', 38)}<div><span>${t('paidOut')}</span><b>${usd(total)}</b></div></div>
      <div class="kpi">${IC('crown', 38)}<div><span>${t('creatorsEarning')}</span><b>${nf(R.length)}</b></div></div>
      <div class="kpi">${IC('trophy', 38)}<div><span>${t('topCoinEarn')}</span><b>${usd(Math.max(...D.earnings.map((r) => r.earnUsd)))}</b></div></div>
    </div>
    <div class="podium">${[1, 0, 2].map((i) => pod(R[i], i)).join('')}</div>
    <section class="card"><div class="tbl"><div class="tr th" style="${COLS}"><span>#</span><span>${t('creator')}</span><span>${t('mainCoin')}</span><span>${t('earned')}</span><span class="r">${t('mcap')}</span><span class="r">${t('tax')}</span><span class="r">${t('lastPayout')}</span></div>
      ${R.slice(3, 30).map((d, i) => { const c = d.coins[0]; return `<div class="tr hov" style="${COLS}"><span class="mono fa">${i + 4}</span><span style="display:flex;gap:6px;align-items:center;min-width:0">${acct(d.a)}</span>
        <span class="tok">${logo(c.token, 30, c.symbol)}<span class="n"><b>${c.name}</b><small>$${c.symbol}${d.coins.length > 1 ? ` · +${d.coins.length - 1}` : ''}</small></span></span>
        <span class="bar-cell"><span class="bar"><i style="width:${Math.max(3, (d.usd / maxU) * 100)}%"></i></span><b class="mono">${usd(d.usd)}</b></span>
        <span class="r mono">${usd(c.mcap)}</span><span class="r mono">${c.taxBps ? nf(c.taxBps / 100, 1) + '%' : '—'}</span><span class="r mono fa">${c.lastAt ? ago((D.at / 1000 - c.lastAt) / 60) : '—'}</span></div>` }).join('')}</div>
      <p class="foot" style="padding:12px 16px;margin:0;border-top:1px solid var(--line)">${t('lbSource')}</p></section>
  </div>`;
}
function vTraders() {
  const L = D.leaders, medalC = ['#FBBF24', '#D4D4D4', '#D08A52'];
  const bot = `<span class="tag">${IC('bot', 14)}${t('contract')}</span>`;
  const pod = (l, i) => `<div class="pod ${i === 0 ? 'first' : ''}"><span class="medal">${IC('medal', 40, { color: medalC[i] })}</span>${av(l.a, i === 0 ? 76 : 60)}<b class="pn">${nameOf(l.a)}</b><span class="mono mu" style="font-size:11.5px">${short(l.a)}</span><b class="mono" style="font-size:19px">${usd(l.vol)}</b><span class="mu" style="font-size:11.5px">${l.n} ${t('trades').toLowerCase()} · ${l.curves} ${t('tokens')}</span>${l.bot ? bot : ''}</div>`;
  return `<div class="page">
    <div class="row"><div><h1 class="h1">${t('lbTitle')}</h1><p class="sub">${t('lbSub')}</p></div><span class="sp"></span><div class="seg">${[['creators', 'crRewards'], ['traders', 'traders']].map(([k, l]) => `<button data-lb="${k}" aria-pressed="${lbTab === k}">${t(l)}</button>`).join('')}</div></div>
    <div class="podium">${[1, 0, 2].map((i) => pod(L[i], i)).join('')}</div>
    <section class="card"><div class="tbl"><div class="tr th" style="grid-template-columns:48px minmax(0,1.4fr) 110px 110px 110px 80px 80px"><span>#</span><span>${t('account')}</span><span class="r">${t('volume')}</span><span class="r">${t('buy')}</span><span class="r">${t('sell')}</span><span class="r">${t('trades')}</span><span class="r">${t('tokens')}</span></div>
    ${L.slice(3, 20).map((l, i) => `<div class="tr hov" style="grid-template-columns:48px minmax(0,1.4fr) 110px 110px 110px 80px 80px"><span class="mono fa">${i + 4}</span><span style="display:flex;gap:6px;align-items:center">${acct(l.a)}${l.bot ? bot : ''}</span><span class="r mono">${usd(l.vol)}</span><span class="r mono up">${usd(l.buy)}</span><span class="r mono dn">${usd(l.sell)}</span><span class="r mono">${l.n}</span><span class="r mono">${l.curves}</span></div>`).join('')}</div></section></div>`;
}



function vIcons() {
  const order = ['solar', 'mingcute', 'game-icons', 'fluent-emoji-flat', 'streamline-flex-color', 'fluent3d'];
  return `<div class="page"><div><h1 class="h1">${t('icTitle')}</h1><p class="sub">${t('icSub')}</p></div>
    <div class="sets">${order.map((s) => { const inf = SET_INFO[s]; return `<section class="card set ${iconSet === s ? 'on' : ''}">
      <div class="set-h"><div><b>${inf.name}</b><small>${inf.by} · ${inf.lic}</small></div><span class="sp"></span>${iconSet === s ? `<span class="tag buy">${I('check', 'sm')}${t('inUse')}</span>` : `<button class="btn sm" data-set="${s}">${t('useStyle')}</button>`}</div>
      <div class="grid">${CONCEPTS.map((c) => `<div class="cell"><span class="tile">${IC(c, 30, { set: s })}</span><small>${t('c_' + c)}</small></div>`).join('')}</div>
      <div class="demo"><span class="side-ic" style="width:34px;height:34px">${IC('whale', 22, { set: s })}</span><span>${acctTxt(D.bigBuys[0].trader)} <b>${usd(D.bigBuys[0].usd)}</b></span><span class="sp"></span>${IC('launch', 20, { set: s })}${IC('graduated', 20, { set: s })}${IC('rewards', 20, { set: s })}</div>
    </section>` }).join('')}</div></div>`;
}

function vPortfolio() {
  const P = D.portfolio, rows = P.holdings.map((h) => ({ ...h, x: TOK.find((x) => x.token.toLowerCase() === h.token.toLowerCase()) })).filter((h) => h.x);
  const value = rows.reduce((s, h) => s + h.amount * h.x.price, 0);
  return `<div class="page">
    <div class="row">${av(P.owner, 60)}<div><h1 class="h1">${nameOf(P.owner)} <span class="mono fa" style="font-size:14px;font-weight:500">${short(P.owner)}</span></h1><p class="sub">${t('pfSub')}</p></div><span class="sp"></span><label class="search" style="width:290px">${I('search')}<input placeholder="${t('viewWallet')}"></label></div>
    <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
      <div class="kpi">${E('Money bag', 38)}<div><span>${t('value')}</span><b>${usd(value + P.eth * D.eth)}</b></div></div>
      <div class="kpi">${E('Gem stone', 38)}<div><span>${t('tokens')}</span><b>${rows.length}</b></div></div>
      <div class="kpi">${ETH(38)}<div><span>ETH</span><b>${nf(P.eth, 4)}</b></div></div>
    </div>
    <section class="card"><div class="tbl"><div class="tr th" style="grid-template-columns:minmax(0,1.6fr) 150px 120px 120px 100px"><span>${t('position')}</span><span>${t('curve')}</span><span class="r">${t('balance')}</span><span class="r">${t('value')}</span><span class="r">${t('trend')}</span></div>
      ${rows.map((h) => `<a class="tr" href="#token" style="grid-template-columns:minmax(0,1.6fr) 150px 120px 120px 100px"><div class="tok">${logo(h.x.token, 36)}<div class="n"><b>${h.x.name}</b><small>$${h.x.symbol}</small></div></div><div class="prog"><div class="trk"><i style="width:${h.x.progress * 100}%"></i></div><em>${nf(h.x.progress * 100, 0)}%</em></div><span class="r mono">${nf(h.amount / 1e6, 2)}M</span><span class="r mono">${usd(h.amount * h.x.price)}</span><span style="justify-self:end">${spark(h.x.spark)}</span></a>`).join('')}</div></section>
    <p class="foot">${t('avatarNote')}.</p></div>`;
}

function vAlerts() {
  const near = TOK.filter((x) => x.progress >= 0.3 && !x.graduated).slice(0, 2);
  const items = [...BIGB.slice(0, 5).map((w) => ({ em: w.usd >= 1000 ? 'Spouting whale' : 'Dolphin', token: w.token, text: `${t(w.usd >= 1000 ? 'whaleT' : 'dolphinT')} · <b>${usd(w.usd)}</b> · ${acctTxt(w.trader)}`, b: w.block })),
    ...near.map((x) => ({ em: 'Rocket', token: x.token, text: `${t('near')} <b>${Math.floor(x.progress * 4) * 25 || 25}%</b> ${t('curveTo')}`, b: D.head - 600 }))];
  const rule = (em, a, b, on) => `<label class="rule">${E(em, 30)}<div><b>${t(a)}</b><small>${t(b)}</small></div><input type="checkbox" class="sw" ${on ? 'checked' : ''}></label>`;
  return `<div class="page"><div class="row"><div><h1 class="h1">${t('alTitle')}</h1><p class="sub">${t('alSub')}</p></div><span class="sp"></span><button class="btn pri">${I('bell-ring')}${t('allow')}</button></div>
    <div class="two"><section class="card"><div class="sec-h">${E('Bell', 26)}<h3>${t('rules')}</h3></div>
      ${rule('Rocket', 'r1', 'r1s', true)}${rule('Graduation cap', 'r2', 'r2s', true)}${rule('Chart decreasing', 'r3', 'r3s', true)}${rule('Sparkles', 'r4', 'r4s', true)}${rule('Spouting whale', 'r5', 'r5s', false)}</section>
    <section class="card feed"><div class="sec-h">${E('High voltage', 26)}<h3>${t('recent')}</h3></div>
      ${items.map((it) => `<div class="it"><span class="badge">${logo(it.token, 36)}${E(it.em, 20)}</span><p><b>$${tokInfo(it.token).symbol}</b> · ${it.text}</p><time>${agoB(it.b)}</time></div>`).join('')}</section></div></div>`;
}

function vMail() {
  return `<div class="page"><div class="row"><div><h1 class="h1">${t('mlTitle')}</h1><p class="sub">${t('mlSub')}</p></div></div>
    <div class="two"><section class="card"><div class="sec-h">${E('Envelope with arrow', 26)}<h3>${t('inbox')}</h3></div>
      <div class="empty">${E('Locked', 54)}<span>${t('connectMail')}</span><button class="btn pri">${I('wallet')}${t('connect')}</button></div></section>
    <section class="card"><div class="sec-h"><img src="${PONS}" width="28" height="28" class="img" alt=""><h3>${t('payPons')}</h3></div>
      <div style="padding:16px;display:flex;flex-direction:column;gap:14px">
        <label class="mu" style="font-size:12px">${t('setPrice')}<div class="row" style="margin-top:6px"><div class="search" style="width:100%"><img src="${PONS}" width="20" height="20" class="img" alt=""><input value="250"><b class="mono">PONS</b></div></div></label>
        <div><div class="mu" style="font-size:12px;margin-bottom:6px">${t('rule')}</div><div class="seg"><button aria-pressed="true">${I('undo-2', 'sm')}${t('refund')}</button><button aria-pressed="false">${E('Money bag', 16)}${t('keep')}</button><button aria-pressed="false">${I('split', 'sm')}${t('split')}</button></div></div>
      </div></section></div></div>`;
}

/* ---------- render ---------- */
function render() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  rail(); topbar();
  const r = route();
  document.getElementById('view').innerHTML = r === 'token' ? vToken() : r === 'launches' ? vLaunches() : r === 'leaderboard' ? vLeader() : r === 'icons' ? vIcons() : r === 'portfolio' ? vPortfolio() : r === 'alerts' ? vAlerts() : r === 'mail' ? vMail() : vRadar();
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act],[data-set],[data-lang],[data-f],[data-lb],[data-tab],[data-side],[data-pg]');
  if (!b) { if (menuOpen && !e.target.closest('.lang')) { menuOpen = false; render() } return }
  if (b.dataset.act === 'fold') { folded = !folded; store.set('orbit:fold', folded ? '1' : '0') }
  if (b.dataset.act === 'lang') menuOpen = !menuOpen;
  if (b.dataset.lang) { langPref = b.dataset.lang; store.set('orbit:lang', langPref === 'auto' ? null : langPref); lang = langPref === 'auto' ? detect() : langPref; menuOpen = false }
  if (b.dataset.f) filt = b.dataset.f;
  if (b.dataset.set) { iconSet = b.dataset.set; store.set('orbit:icons', iconSet) }
  if (b.dataset.lb) lbTab = b.dataset.lb;
  if (b.dataset.tab) tokTab = b.dataset.tab;
  if (b.dataset.side) { side = b.dataset.side; page = 0 }
  if (b.dataset.pg) page = b.dataset.pg === 'first' ? 0 : b.dataset.pg === 'prev' ? Math.max(0, page - 1) : page + 1;
  render();
});
document.addEventListener('change', (e) => { if (e.target.id === 'per') { per = +e.target.value; page = 0; render() } });
document.addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); document.getElementById('q')?.focus() } if (e.key === 'Escape' && menuOpen) { menuOpen = false; render() } });
addEventListener('hashchange', () => { document.getElementById('view').scrollTo(0, 0); render() });
render();
if (langPref === 'auto' && !store.get('orbit:lang-told')) {
  document.getElementById('toast').innerHTML = `<div class="toast" role="status">${I('globe')}<span>${t('langSet')}</span><button class="x" aria-label="OK" onclick="this.parentElement.remove()">${I('x', 'sm')}</button></div>`;
  store.set('orbit:lang-told', '1');
  setTimeout(() => document.querySelector('.toast')?.remove(), 6000);
}
</script>
